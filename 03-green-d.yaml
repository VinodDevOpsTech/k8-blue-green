apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  labels:
    name: nginx
    version: green
spec:
  # modify replicas according to your case
  replicas: 4
  selector:
    matchLabels:
      name: nginx
      version: green
  template:
    metadata:
      name: nginx
      labels:
        name: nginx
        version: green
    spec:
      containers:
      - name: nginx
        image: maxdevopstech/blue-green:2.0.0
        imagePullPolicy: Always
        ports:
        - containerPort: 80